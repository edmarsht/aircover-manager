<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirCover Manager — Créer un compte</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF385C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirCover">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-dot">AC</span> AirCover Manager</div>

    <div class="auth-error" id="error"></div>

    <form id="form">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
        <div class="hint">6 caractères minimum.</div>
      </div>
      <div class="field">
        <label for="password2">Confirmer le mot de passe</label>
        <input type="password" id="password2" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Créer mon compte</button>
    </form>

    <div class="auth-footer">Déjà un compte ? <a href="login.html">Se connecter</a></div>
  </div>
</div>

<script type="module">
  import { signup, auth } from './app.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  /* Le drapeau signingUp évite que cette redirection ne se déclenche pendant
     l'inscription elle-même : createUserWithEmailAndPassword() authentifie
     immédiatement l'utilisateur, avant même que signup() ait fini d'écrire son
     profil dans Firestore — sans ce garde-fou, la navigation coupait cette
     écriture en cours de route. */
  let signingUp = false;
  onAuthStateChanged(auth, (user) => {
    if (user && !signingUp) location.href = 'index.html';
  });

  const errorBox = document.getElementById('error');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      showError('Les mots de passe ne correspondent pas.');
      return;
    }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Création…';
    signingUp = true;
    try {
      await signup(email, password);
      location.href = 'index.html';
    } catch (err) {
      signingUp = false;
      btn.disabled = false;
      btn.textContent = 'Créer mon compte';
      const messages = {
        'auth/email-already-in-use': 'Un compte existe déjà avec cet email.',
        'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
        'auth/invalid-email': 'Adresse email invalide.',
      };
      showError(messages[err.code] || 'Erreur lors de la création du compte, réessaye.');
    }
  });
</script>
</body>
</html>
