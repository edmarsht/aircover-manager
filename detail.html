<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirCover Manager — Détail</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="logo-dot">AC</span> AirCover Manager</a>
  <nav>
    <a href="index.html">Liste</a>
  </nav>
</div>

<main>
  <a href="index.html" class="back-link">← Retour à la liste</a>

  <div id="content"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import {
    getItem, updateItem, loadUsers, getStatus, buildEmailContent,
    formatPrice, formatDateShort, initials, addDays, DELAI_JOURS,
    uploadAttachment, openLightbox,
  } from './app.js';

  const params = new URLSearchParams(location.search);
  const itemId = params.get('id');
  const justCreated = params.get('justCreated') === '1';
  let editMode = false;
  let item = null;
  let users = [];
  let editNewAttachments = [];

  async function init() {
    item = await getItem(itemId);
    if (!item) {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="big-emoji">🔍</div>
          <p>Cet AirCover est introuvable.</p>
        </div>`;
      return;
    }
    await render();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function statusBadge(status) {
    return `<span class="badge badge-${status.key}">${status.label}</span>`;
  }

  async function render() {
    item = await getItem(itemId);
    if (editMode) users = await loadUsers();
    const status = getStatus(item);

    document.getElementById('content').innerHTML = `
      ${justCreated ? `<div class="email-banner">✅ AirCover enregistré. Un email récapitulatif a été envoyé (simulé) à ${escapeHtml(item.proprietaire.email)}.</div>` : ''}
      ${item.reminderEnvoye
        ? `<div class="email-banner">✅ Rappel automatique envoyé le ${formatDateShort(item.reminderEnvoyeLe)} à ${escapeHtml(item.proprietaire.email)}.</div>`
        : (!item.statutTermine && status.key !== 'done' ? `<div class="reminder-banner">⏰ Rappel automatique prévu le ${formatDateShort(item.dateAircover)} (départ du locataire + ${DELAI_JOURS} jours) à ${escapeHtml(item.proprietaire.email)}.</div>` : '')}

      <div class="detail-header">
        <div>
          <div class="title-line" style="margin-bottom:8px;">
            <h1 style="margin:0;font-size:24px;">${escapeHtml(item.titre)}</h1>
            ${statusBadge(status)}
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          ${!editMode ? `
            <button class="btn btn-primary" onclick="enterEdit()">✏️ Modifier</button>
          ` : `
            <button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button>
            <button class="btn btn-primary" onclick="saveEdit(event)">Enregistrer</button>
          `}
        </div>
      </div>

      <div class="detail-grid">
        <div>
          <div class="card" style="padding:24px;margin-bottom:16px;">
            ${editMode ? renderEditForm() : renderView()}
          </div>

          <div class="card" style="padding:24px;">
            <div class="info-block">
              <h3>Contenu de l'email envoyé au propriétaire</h3>
              <div class="email-preview" id="email-preview">${escapeHtml(buildEmailContent(item))}</div>
              <div style="margin-top:12px;">
                <button class="btn btn-secondary" onclick="copyEmail()">📋 Copier le contenu</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card side-card">
          <div class="owner-pill">
            <div class="avatar">${initials(item.proprietaire.nom)}</div>
            <div>
              <div class="owner-name">${escapeHtml(item.proprietaire.nom)}</div>
              <div class="owner-email">${escapeHtml(item.proprietaire.email)}</div>
            </div>
          </div>
          <div class="side-row"><span class="k">Appartement</span><span class="v">${escapeHtml(item.appartement) || '—'}</span></div>
          <div class="side-row"><span class="k">Locataire</span><span class="v">${escapeHtml(item.locataire)}</span></div>
          <div class="side-row"><span class="k">Prix</span><span class="v">${formatPrice(item.prix)}</span></div>
          <div class="side-row"><span class="k">Départ locataire</span><span class="v">${formatDateShort(item.dateDepart)}</span></div>
          <div class="side-row"><span class="k">Jour AirCover</span><span class="v">${formatDateShort(item.dateAircover)}</span></div>
          <div class="side-row"><span class="k">Email envoyé</span><span class="v">${item.emailEnvoye ? '✅ ' + formatDateShort(item.emailEnvoyeLe) : '— pas encore'}</span></div>
          <div class="side-row"><span class="k">Rappel email jour J</span><span class="v">${item.reminderEnvoye ? '✅ ' + formatDateShort(item.reminderEnvoyeLe) : '— pas encore'}</span></div>
          <div class="side-row"><span class="k">Rappel SMS jour J</span><span class="v">${item.smsEnvoye ? '✅ ' + formatDateShort(item.smsEnvoyeLe) : (item.proprietaire.telephone ? '— pas encore' : '— pas de téléphone')}</span></div>
          <div class="side-row"><span class="k">Pièces jointes</span><span class="v">${item.pieceJointes.length}</span></div>
        </div>
      </div>
    `;

  }

  function renderAttachmentChips(pieceJointes) {
    if (!pieceJointes.length) return '<p>Aucune pièce jointe.</p>';
    return `
      <div class="attachment-list">
        ${pieceJointes.map(a => `
          <div class="attachment-chip" data-url="${a.url}" data-name="${escapeHtml(a.name)}" data-image="${a.isImage ? '1' : '0'}">
            ${a.isImage ? `<img src="${a.url}">` : '📄'}
            <span>${escapeHtml(a.name)}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderView() {
    return `
      <div class="info-block">
        <h3>Description du problème</h3>
        <p>${escapeHtml(item.description) || '—'}</p>
      </div>
      <div class="info-block">
        <h3>Détails complémentaires</h3>
        <p>${escapeHtml(item.details) || '—'}</p>
      </div>
      <div class="info-block">
        <h3>Pièces jointes</h3>
        ${renderAttachmentChips(item.pieceJointes)}
      </div>
    `;
  }

  function renderEditForm() {
    return `
      <div class="field">
        <label>Titre</label>
        <input type="text" id="e-titre" value="${escapeHtml(item.titre)}">
      </div>
      <div class="field">
        <label>Description du problème</label>
        <textarea id="e-description">${escapeHtml(item.description)}</textarea>
      </div>
      <div class="field">
        <label>Détails complémentaires</label>
        <textarea id="e-details">${escapeHtml(item.details)}</textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Appartement concerné</label>
          <input type="text" id="e-appartement" value="${escapeHtml(item.appartement)}">
        </div>
        <div class="field">
          <label>Nom du locataire</label>
          <input type="text" id="e-locataire" value="${escapeHtml(item.locataire)}">
        </div>
        <div class="field">
          <label>Prix demandé (€)</label>
          <input type="number" id="e-prix" min="0" step="0.01" value="${item.prix}">
        </div>
        <div class="field">
          <label>Date de départ du locataire</label>
          <input type="date" id="e-date-depart" value="${item.dateDepart}">
        </div>
        <div class="field">
          <label>Jour où l'AirCover doit être fait</label>
          <input type="date" id="e-date-aircover" value="${item.dateAircover}">
        </div>
      </div>
      <div class="field">
        <label>Propriétaire de la tâche</label>
        <select id="e-owner">
          ${users.map(u => `<option value="${u.id}" ${u.id === item.proprietaire.id ? 'selected' : ''}>${escapeHtml(u.nom)} (${escapeHtml(u.email)})</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Pièces jointes</label>
        ${renderAttachmentChips(item.pieceJointes)}
      </div>
      <div class="field">
        <label>Ajouter des pièces jointes</label>
        <input type="file" id="e-attachments-input" multiple>
        <div class="attachment-list" id="e-new-attachment-list"></div>
      </div>
    `;
  }

  function renderEditAttachmentPreviews() {
    const box = document.getElementById('e-new-attachment-list');
    if (!box) return;
    box.innerHTML = editNewAttachments.map((a, idx) => `
      <div class="attachment-chip" data-preview-idx="${idx}">
        ${a.isImage ? `<img src="${a.previewUrl}">` : '📄'}
        <span>${escapeHtml(a.name)}</span>
        <span class="remove" data-remove-idx="${idx}">✕</span>
      </div>
    `).join('');
  }

  async function enterEdit() {
    editMode = true;
    editNewAttachments = [];
    await render();
    document.getElementById('e-date-depart').addEventListener('change', (e) => {
      document.getElementById('e-date-aircover').value = addDays(e.target.value, DELAI_JOURS);
    });
    document.getElementById('e-attachments-input').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const isImage = file.type.startsWith('image/');
        editNewAttachments.push({ file, name: file.name, previewUrl: URL.createObjectURL(file), isImage });
      });
      renderEditAttachmentPreviews();
      e.target.value = '';
    });
  }

  async function cancelEdit() {
    editMode = false;
    await render();
  }

  async function saveEdit(e) {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = 'Enregistrement…';

    const owner = users.find(u => u.id === document.getElementById('e-owner').value);
    const data = {
      titre: document.getElementById('e-titre').value.trim(),
      description: document.getElementById('e-description').value.trim(),
      details: document.getElementById('e-details').value.trim(),
      appartement: document.getElementById('e-appartement').value.trim(),
      locataire: document.getElementById('e-locataire').value.trim(),
      prix: parseFloat(document.getElementById('e-prix').value),
      dateDepart: document.getElementById('e-date-depart').value,
      dateAircover: document.getElementById('e-date-aircover').value,
      proprietaire: owner,
    };
    if (editNewAttachments.length) {
      const uploaded = await Promise.all(editNewAttachments.map(a => uploadAttachment(item.id, a.file)));
      data.pieceJointes = [...item.pieceJointes, ...uploaded];
    }
    await updateItem(item.id, data);
    editMode = false;
    editNewAttachments = [];
    await render();
    showToast('Modifications enregistrées.');
  }

  function copyEmail() {
    const text = buildEmailContent(item);
    navigator.clipboard.writeText(text).then(() => showToast('Contenu copié dans le presse-papiers.'));
  }

  window.enterEdit = enterEdit;
  window.cancelEdit = cancelEdit;
  window.saveEdit = saveEdit;
  window.copyEmail = copyEmail;

  document.getElementById('content').addEventListener('click', (e) => {
    const removeBtn = e.target.closest('.remove[data-remove-idx]');
    if (removeBtn) {
      editNewAttachments.splice(Number(removeBtn.dataset.removeIdx), 1);
      renderEditAttachmentPreviews();
      return;
    }
    const chip = e.target.closest('.attachment-chip');
    if (!chip) return;
    if (chip.dataset.previewIdx !== undefined) {
      const a = editNewAttachments[Number(chip.dataset.previewIdx)];
      if (a) openLightbox({ url: a.previewUrl, name: a.name, isImage: a.isImage });
    } else if (chip.dataset.url) {
      openLightbox({ url: chip.dataset.url, name: chip.dataset.name, isImage: chip.dataset.image === '1' });
    }
  });

  init();

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
