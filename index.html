<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirCover Manager — Liste</title>
<meta name="description" content="Zéro AirCover oublié — suivi automatique des délais et rappels par email pour vos AirCover Airbnb.">
<meta property="og:type" content="website">
<meta property="og:title" content="AirCover Manager">
<meta property="og:description" content="Zéro AirCover oublié — suivi automatique des délais et rappels par email pour vos AirCover Airbnb.">
<meta property="og:image" content="https://edmarsht.github.io/aircover-manager/og-image.png">
<meta property="og:url" content="https://edmarsht.github.io/aircover-manager/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AirCover Manager">
<meta name="twitter:description" content="Zéro AirCover oublié — suivi automatique des délais et rappels par email pour vos AirCover Airbnb.">
<meta name="twitter:image" content="https://edmarsht.github.io/aircover-manager/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="logo-dot">AC</span> AirCover Manager</a>
  <nav>
    <a href="index.html" class="active">Liste</a>
    <a href="users.html" class="icon-link" title="Utilisateurs">⚙️</a>
  </nav>
</div>

<main>
  <div class="page-header">
    <div>
      <h1>Mes AirCovers</h1>
      <p>Un rappel automatique est envoyé au propriétaire de la tâche 14 jours après le départ du locataire.</p>
    </div>
    <a href="new.html" class="btn btn-primary">+ Nouveau AirCover</a>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">Tous</button>
    <button class="chip" data-filter="today" id="chip-today">Aujourd'hui</button>
    <button class="chip" data-filter="upcoming">À venir</button>
    <button class="chip" data-filter="done">Terminés</button>
  </div>

  <div class="list" id="list"></div>

  <div class="empty-state" id="empty" style="display:none">
    <svg class="empty-cat" viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
      <path class="cat-body" d="M16 10 L26 26 L38 26 L48 10 L44 30 A18 18 0 1 1 20 30 Z"/>
      <circle cx="26" cy="34" r="2.6" fill="#3A1414"/>
      <circle cx="38" cy="34" r="2.6" fill="#3A1414"/>
      <path d="M23 42 Q32 37 41 42" stroke="#3A1414" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M25.5 38.5 Q26.5 41 25 43" stroke="#3A1414" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <p>Aucun AirCover dans cette catégorie.</p>
  </div>
</main>

<script type="module">
  import { loadItems, getStatus, formatPrice, formatDateShort } from './app.js';

  let currentFilter = 'all';
  let allItems = [];

  function statusBadge(status) {
    return `<span class="badge badge-${status.key}">${status.label}</span>`;
  }

  async function loadAndRender() {
    document.getElementById('list').innerHTML = '<p style="padding:24px;color:var(--muted)">Chargement…</p>';
    allItems = await loadItems();
    render();
  }

  function render() {
    const items = allItems
      .map(i => ({ item: i, status: getStatus(i) }))
      .sort((a, b) => new Date(a.item.dateAircover) - new Date(b.item.dateAircover));

    document.getElementById('chip-today').classList.toggle('has-today', items.some(x => x.status.key === 'today'));

    const filtered = currentFilter === 'all'
      ? items
      : items.filter(x => x.status.key === currentFilter);

    const list = document.getElementById('list');
    const empty = document.getElementById('empty');

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map(({ item, status }) => `
      <div class="card aircover-row" onclick="location.href='detail.html?id=${item.id}'">
        <div class="col-main">
          <div class="title-line">
            <h3>${escapeHtml(item.titre)}</h3>
            ${statusBadge(status)}
          </div>
          <div class="meta-line">
            <span>👤 ${escapeHtml(item.proprietaire.nom)}</span>
            <span>🏢 ${escapeHtml(item.appartement || '—')}</span>
            <span>🏠 Locataire : ${escapeHtml(item.locataire)}</span>
            <span>📎 ${item.pieceJointes.length} pièce(s) jointe(s)</span>
            ${item.reminderEnvoye ? '<span>✅ Rappel envoyé</span>' : '<span>✉️ Rappel à venir</span>'}
          </div>
        </div>
        <div class="col-price">${formatPrice(item.prix)}</div>
        <div class="col-date">
          <div class="label">AirCover à faire le</div>
          <div class="value">${formatDateShort(item.dateAircover)}</div>
        </div>
        <div class="chevron">›</div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });

  loadAndRender();
</script>
</body>
</html>
