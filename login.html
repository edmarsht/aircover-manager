<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirCover Manager — Connexion</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF385C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AirCover">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-dot">AC</span> AirCover Manager</div>

    <div class="auth-error" id="error"></div>

    <form id="form">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password-field">
          <input type="password" id="password" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-target="password" aria-label="Afficher le mot de passe"></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Se connecter</button>
    </form>

    <div class="auth-footer"><a href="#" id="forgot-link">Mot de passe oublié ?</a></div>
    <div class="auth-footer">Pas encore de compte ? <a href="/signup.html">Créer un compte</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { login, resetPassword, auth } from './app.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (user) location.href = '/';
  });

  const errorBox = document.getElementById('error');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3200);
  }

  const EYE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.innerHTML = EYE_ICON;
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF_ICON : EYE_ICON;
      btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    });
  });

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = e.target.querySelector('button[type="submit"]');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Connexion…';
    try {
      await login(email, password);
      location.href = '/';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = originalLabel;
      showError(['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'].includes(err.code)
        ? 'Email ou mot de passe incorrect.'
        : `Erreur de connexion, réessaye. (${err.code || err.message})`);
    }
  });

  document.getElementById('forgot-link').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if (!email) {
      showError('Renseigne ton email ci-dessus puis reclique sur "Mot de passe oublié".');
      return;
    }
    try {
      await resetPassword(email);
      errorBox.classList.remove('show');
      showToast('Email de réinitialisation envoyé à ' + email + '.');
    } catch (err) {
      showError(`Impossible d'envoyer l'email de réinitialisation. (${err.code || err.message})`);
    }
  });
</script>
</body>
</html>
